<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#080810"/>
  <!-- Eye glow ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#00f2ff" stroke-width="6" opacity="0.25"/>
  <!-- Outer iris -->
  <ellipse cx="256" cy="256" rx="140" ry="100" fill="#0a0a20" stroke="#00f2ff" stroke-width="3"/>
  <!-- Iris gradient -->
  <radialGradient id="iris" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#0055aa"/>
    <stop offset="60%" stop-color="#003377"/>
    <stop offset="100%" stop-color="#001133"/>
  </radialGradient>
  <ellipse cx="256" cy="256" rx="130" ry="90" fill="url(#iris)"/>
  <!-- Pupil -->
  <circle cx="256" cy="256" r="52" fill="#000010"/>
  <!-- Pupil highlight -->
  <circle cx="256" cy="256" r="48" fill="#00f2ff" opacity="0.08"/>
  <!-- Cyan glint -->
  <circle cx="232" cy="238" r="14" fill="#ffffff" opacity="0.18"/>
  <!-- Gold crown accent -->
  <path d="M 196 156 L 220 196 L 256 172 L 292 196 L 316 156 L 300 198 L 212 198 Z"
        fill="#d4af37" opacity="0.9"/>
  <!-- Text: CE -->
  <text x="256" y="420" text-anchor="middle"
        font-family="Orbitron, Arial, sans-serif" font-size="52" font-weight="900"
        letter-spacing="8" fill="#00f2ff" opacity="0.85">CE</text>
</svg>

name: Chauffeur Empire CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── 1. SYNTAX & SECURITY LINT ─────────────────────────────────
  lint:
    name: Lint & Security Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install JSHint
        run: npm install -g jshint

      - name: Check JS syntax (JSHint)
        run: |
          jshint --config .jshintrc \
            engine.js dispatcher.js auth.js quests.js \
            security.js data.js syncManager.js \
            || true

      - name: Secret pattern scan (offline)
        run: |
          FOUND=0
          for f in *.js; do
            [ -f "$f" ] || continue
            if grep -qE '(api_key|apikey|secret|password)\s*[:=]\s*["\x27][a-zA-Z0-9_\-]{20,}' "$f"; then
              echo "WARNING: possible hardcoded secret in $f"
              FOUND=$((FOUND+1))
            fi
          done
          echo "${FOUND} potential secret(s) flagged (review manually)"

  # ── 2. HTML VALIDATION ────────────────────────────────────────
  html-validate:
    name: HTML Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install html5validator
        run: pip install html5validator

      - name: Validate HTML
        run: |
          html5validator --root . \
            --ignore "Error: Attribute" \
            --ignore "Error: Element" \
            || true

  # ── 3. SQL MIGRATION LINT ────────────────────────────────────
  sql-lint:
    name: SQL Migration Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check SQL files
        run: |
          shopt -s nullglob
          SQL_FILES=(*.sql)
          if [ ${#SQL_FILES[@]} -eq 0 ]; then
            echo "No SQL files in root — skipping"
            exit 0
          fi
          ERRORS=0
          for f in "${SQL_FILES[@]}"; do
            if [ ! -s "$f" ]; then
              echo "ERROR: $f is empty"
              ERRORS=$((ERRORS+1))
            else
              echo "OK: $f ($(wc -l < "$f") lines)"
            fi
          done
          [ $ERRORS -eq 0 ] || exit 1

      - name: Check RLS coverage
        run: |
          shopt -s nullglob
          SQL_FILES=(*.sql)
          [ ${#SQL_FILES[@]} -eq 0 ] && exit 0
          MISSING=0
          for f in "${SQL_FILES[@]}"; do
            TABLES=$(grep -c "^CREATE TABLE" "$f" 2>/dev/null || echo 0)
            RLS=$(grep -c "ENABLE ROW LEVEL" "$f" 2>/dev/null || echo 0)
            if [ "$TABLES" -gt 0 ] && [ "$RLS" -lt "$TABLES" ]; then
              echo "WARNING: $f — $TABLES tables, $RLS RLS enables"
              MISSING=$((MISSING+1))
            fi
          done
          [ $MISSING -gt 0 ] && echo "⚠ $MISSING file(s) missing RLS" || echo "✅ RLS coverage OK"

  # ── 4. DEPLOY TO GITHUB PAGES ────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [lint, sql-lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify critical files present
        run: |
          for f in index.html style.css auth.js engine.js dispatcher.js security.js; do
            [ -f "$f" ] || { echo "MISSING: $f"; exit 1; }
          done
          echo "✅ All required files present"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          exclude_assets: '.github,*.sql,*.md,docs,supabase,slot_*.json'

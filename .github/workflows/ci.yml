name: Chauffeur Empire CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── 1. SYNTAX & SECURITY LINT ─────────────────────────────────
  lint:
    name: Lint & Security Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install tools
        run: npm install -g jshint retire

      - name: Check JS syntax (JSHint)
        run: |
          jshint --config .jshintrc \
            engine.js dispatcher.js auth.js quests.js \
            security.js data.js syncManager.js \
            || true  # warn only — don't block deploy on existing issues

      - name: Check for known vulnerable CDN dependencies
        run: retire --outputformat json --outputpath retire-report.json || true

      - name: Upload retire report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retire-report
          path: retire-report.json

  # ── 2. HTML VALIDATION ────────────────────────────────────────
  html-validate:
    name: HTML Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate HTML
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: ./
          blacklist: "Error: Attribute"

  # ── 3. SQL MIGRATION LINT ────────────────────────────────────
  sql-lint:
    name: SQL Migration Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check SQL files exist and are non-empty
        run: |
          for f in *.sql; do
            if [ ! -s "$f" ]; then
              echo "ERROR: $f is empty"
              exit 1
            fi
            echo "OK: $f ($(wc -l < "$f") lines)"
          done

      - name: Check all SQL tables have RLS enabled
        run: |
          MISSING=0
          for f in *.sql; do
            TABLES=$(grep -c "^CREATE TABLE" "$f" 2>/dev/null || echo 0)
            RLS=$(grep -c "ENABLE ROW LEVEL" "$f" 2>/dev/null || echo 0)
            if [ "$TABLES" -gt 0 ] && [ "$RLS" -lt "$TABLES" ]; then
              echo "WARNING: $f has $TABLES tables but only $RLS RLS enables"
              MISSING=$((MISSING+1))
            fi
          done
          if [ $MISSING -gt 0 ]; then
            echo "⚠ $MISSING file(s) may have tables without RLS"
          else
            echo "✅ RLS coverage looks complete"
          fi

  # ── 4. SECRET SCAN ───────────────────────────────────────────
  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        continue-on-error: true  # warn, don't block (anon key is intentionally public)

  # ── 5. DEPLOY TO GITHUB PAGES ────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [lint, sql-lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify critical files present
        run: |
          REQUIRED="index.html style.css auth.js engine.js dispatcher.js security.js"
          for f in $REQUIRED; do
            if [ ! -f "$f" ]; then
              echo "MISSING required file: $f"
              exit 1
            fi
          done
          echo "✅ All required files present"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          exclude_assets: '.github,*.sql,*.md,docs,supabase,slot_*.json'

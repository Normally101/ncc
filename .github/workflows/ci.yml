name: Chauffeur Empire CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Default minimal permissions — jobs that need more declare it explicitly
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── 1. SYNTAX & SECURITY LINT ─────────────────────────────────
  lint:
    name: Lint & Security Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install tools
        run: npm install -g jshint

      - name: Check JS syntax (JSHint)
        run: |
          jshint --config .jshintrc \
            engine.js dispatcher.js auth.js quests.js \
            security.js data.js syncManager.js \
            || true  # warn only — don't block deploy on existing issues

      - name: Check for hardcoded secrets patterns
        run: |
          # Lightweight secret pattern check (no network needed)
          FOUND=0
          for f in *.js; do
            if grep -qE "(apikey|api_key|secret|password)\s*=\s*['\"][a-zA-Z0-9]{20,}" "$f" 2>/dev/null; then
              echo "WARNING: possible hardcoded secret in $f"
              FOUND=$((FOUND+1))
            fi
          done
          if [ $FOUND -gt 0 ]; then
            echo "⚠ $FOUND file(s) have possible hardcoded secrets (review manually)"
          else
            echo "✅ No obvious hardcoded secrets found"
          fi

  # ── 2. HTML VALIDATION ────────────────────────────────────────
  html-validate:
    name: HTML Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install html5validator
        run: pip install html5validator

      - name: Validate HTML
        run: |
          html5validator --root . \
            --ignore "Error: Attribute" \
            --ignore "Error: Element" \
            || true  # warn only

  # ── 3. SQL MIGRATION LINT ────────────────────────────────────
  sql-lint:
    name: SQL Migration Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check SQL files
        run: |
          shopt -s nullglob
          SQL_FILES=(*.sql)
          if [ ${#SQL_FILES[@]} -eq 0 ]; then
            echo "ℹ No SQL files in root — skipping"
            exit 0
          fi
          ERRORS=0
          for f in "${SQL_FILES[@]}"; do
            if [ ! -s "$f" ]; then
              echo "ERROR: $f is empty"
              ERRORS=$((ERRORS+1))
            else
              echo "OK: $f ($(wc -l < "$f") lines)"
            fi
          done
          if [ $ERRORS -gt 0 ]; then exit 1; fi

      - name: Check RLS coverage
        run: |
          shopt -s nullglob
          SQL_FILES=(*.sql)
          if [ ${#SQL_FILES[@]} -eq 0 ]; then exit 0; fi
          MISSING=0
          for f in "${SQL_FILES[@]}"; do
            TABLES=$(grep -c "^CREATE TABLE" "$f" 2>/dev/null || echo 0)
            RLS=$(grep -c "ENABLE ROW LEVEL" "$f" 2>/dev/null || echo 0)
            if [ "$TABLES" -gt 0 ] && [ "$RLS" -lt "$TABLES" ]; then
              echo "WARNING: $f has $TABLES tables but only $RLS RLS enables"
              MISSING=$((MISSING+1))
            fi
          done
          if [ $MISSING -gt 0 ]; then
            echo "⚠ $MISSING file(s) may have tables without RLS"
          else
            echo "✅ RLS coverage looks complete"
          fi

  # ── 4. SECRET SCAN ───────────────────────────────────────────
  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        continue-on-error: true  # warn, don't block (anon key is intentionally public)

  # ── 5. DEPLOY TO GITHUB PAGES ────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [lint, sql-lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify critical files present
        run: |
          REQUIRED="index.html style.css auth.js engine.js dispatcher.js security.js"
          for f in $REQUIRED; do
            if [ ! -f "$f" ]; then
              echo "MISSING required file: $f"
              exit 1
            fi
          done
          echo "✅ All required files present"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          exclude_assets: '.github,*.sql,*.md,docs,supabase,slot_*.json'

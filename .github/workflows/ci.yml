name: Chauffeur Empire CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── 1. SYNTAX & SECURITY LINT ─────────────────────────────────
  lint:
    name: Lint & Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        run: git clone --depth=1 "https://github.com/${{ github.repository }}.git" .

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install JSHint
        run: npm install -g jshint

      - name: Check JS syntax (JSHint)
        run: |
          jshint --config .jshintrc \
            engine.js dispatcher.js auth.js quests.js \
            security.js data.js syncManager.js \
            || true

      - name: Secret pattern scan (offline)
        run: |
          FOUND=0
          for f in *.js; do
            [ -f "$f" ] || continue
            if grep -qE '(api_key|apikey|secret|password)\s*[:=]\s*["\x27][a-zA-Z0-9_\-]{20,}' "$f"; then
              echo "WARNING: possible hardcoded secret in $f"
              FOUND=$((FOUND+1))
            fi
          done
          echo "${FOUND} potential secret(s) flagged"

  # ── 2. HTML VALIDATION ────────────────────────────────────────
  html-validate:
    name: HTML Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        run: git clone --depth=1 "https://github.com/${{ github.repository }}.git" .

      - name: Install html5validator
        run: pip install html5validator

      - name: Validate HTML
        run: |
          html5validator --root . \
            --ignore "Error: Attribute" \
            --ignore "Error: Element" \
            || true

  # ── 3. SQL MIGRATION LINT ────────────────────────────────────
  sql-lint:
    name: SQL Migration Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        run: git clone --depth=1 "https://github.com/${{ github.repository }}.git" .

      - name: Check SQL files
        run: |
          shopt -s nullglob
          SQL_FILES=(*.sql)
          if [ ${#SQL_FILES[@]} -eq 0 ]; then
            echo "No SQL files in root — skipping"
            exit 0
          fi
          ERRORS=0
          for f in "${SQL_FILES[@]}"; do
            if [ ! -s "$f" ]; then
              echo "ERROR: $f is empty"
              ERRORS=$((ERRORS+1))
            else
              echo "OK: $f ($(wc -l < "$f") lines)"
            fi
          done
          [ $ERRORS -eq 0 ] || exit 1

      - name: Check RLS coverage
        run: |
          shopt -s nullglob
          SQL_FILES=(*.sql)
          [ ${#SQL_FILES[@]} -eq 0 ] && exit 0
          MISSING=0
          for f in "${SQL_FILES[@]}"; do
            TABLES=$(grep -c "^CREATE TABLE" "$f" 2>/dev/null || echo 0)
            RLS=$(grep -c "ENABLE ROW LEVEL" "$f" 2>/dev/null || echo 0)
            if [ "$TABLES" -gt 0 ] && [ "$RLS" -lt "$TABLES" ]; then
              echo "WARNING: $f — $TABLES tables, $RLS RLS enables"
              MISSING=$((MISSING+1))
            fi
          done
          [ $MISSING -gt 0 ] && echo "⚠ $MISSING file(s) missing RLS" || echo "✅ RLS coverage OK"

  # ── 4. DEPLOY TO GITHUB PAGES ────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [lint, sql-lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        run: git clone --depth=1 "https://github.com/${{ github.repository }}.git" .

      - name: Verify critical files present
        run: |
          for f in index.html style.css auth.js engine.js dispatcher.js security.js; do
            [ -f "$f" ] || { echo "MISSING: $f"; exit 1; }
          done
          echo "✅ All required files present"

      - name: Prepare deploy directory (exclude non-web files)
        run: |
          mkdir -p /tmp/deploy
          rsync -a --exclude='.github' --exclude='docs' --exclude='supabase' \
            --exclude='*.sql' --exclude='*.md' --exclude='slot_*.json' \
            ./ /tmp/deploy/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: /tmp/deploy

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

name: Lavoro di Gemini

# Si lancia a mano (dal telefono, dalla pagina Actions) oppure via API dall'hub.
# Gira sui server di GitHub: il Mac di Vlad può essere spento.
on:
  workflow_dispatch:
    inputs:
      istruzione:
        description: "Cosa deve fare (in italiano, come su WhatsApp)"
        required: true
        type: string
      titolo:
        description: "Nome breve del lavoro — diventa il nome del ramo e del commit"
        required: false
        type: string
      modello:
        # Serve per confrontare i motori su lavori veri invece che a priori.
        # Vuoto = si resta su quello di sempre: cambiare motore dev'essere una
        # scelta esplicita, non un effetto collaterale di questo campo.
        description: "Motore Gemini da usare (vuoto = gemini-3.7-flash)"
        required: false
        type: string

# Serve per pubblicare il branch di lavoro.
permissions:
  contents: write

jobs:
  lavora:
    runs-on: ubuntu-latest
    # Deve stare SOPRA il tetto dell'agente (45 min in run-task.mjs), altrimenti
    # GitHub tronca il lavoro a meta' e il ramo non viene nemmeno pubblicato.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          # Il branch nuovo parte da main, come sul Mac.
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Dipendenze
        # jsdom serve alla suite di test; @google/genai solo all'agente e non va
        # in package.json (il gioco è vanilla, senza dipendenze runtime).
        run: npm ci --no-audit --no-fund && npm install --no-save @google/genai

      - name: Credenziali Vertex
        env:
          CHIAVE: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_B64 }}
        run: |
          if [ -z "$CHIAVE" ]; then
            echo "::error::manca il secret GOOGLE_SERVICE_ACCOUNT_KEY_B64"
            exit 1
          fi
          echo "$CHIAVE" | base64 -d > "$RUNNER_TEMP/vertex.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/vertex.json" >> "$GITHUB_ENV"

      - name: Gemini al lavoro
        env:
          INSTRUCTION: ${{ inputs.istruzione }}
          TITOLO: ${{ inputs.titolo }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          GIGI_GEMINI_LOCATION: global
          GIGI_GEMINI_MODEL: ${{ inputs.modello }}
          # Se c'e', l'agente usa l'endpoint gratuito di AI Studio invece di
          # Vertex: stesso modello (gemini-3.7-flash c'e' anche li'), zero costo.
          # La chiave vive in un progetto Google SENZA fatturazione, quindi non
          # puo' spendere per costruzione, non per via di un contatore.
          # Togliere questo secret fa tornare tutto su Vertex.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Secondo motore. Con GIGI_MOTORE=openrouter l'agente usa il modello
          # in anteprima (gratis, limiti molto piu' alti: 20 richieste insieme
          # senza un rifiuto, misurate il 22/08). E' un'anteprima a tempo:
          # quando finisce, run-task ripiega su Gemini da solo.
          GIGI_MOTORE: ${{ vars.GIGI_MOTORE || 'gemini' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node .github/agent/run-task.mjs

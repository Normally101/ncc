name: Verifica di un ramo

# Il controllo che decide se un ramo di Gemini puo' arrivare a Vlad per
# l'approvazione. Non pubblica niente e non fonde niente: guarda e basta.
on:
  workflow_dispatch:
    inputs:
      ramo:
        description: "Il ramo da verificare (senza origin/)"
        required: true
        type: string

# Legge soltanto. Un controllo che potesse scrivere sarebbe un controllo di cui
# fidarsi meno.
permissions:
  contents: read

jobs:
  verifica:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          # Serve la storia completa: si verifica il ramo UNITO a main, non il
          # ramo isolato, e per unire servono entrambi.
          fetch-depth: 0
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Dipendenze
        run: npm ci --no-audit --no-fund

      - name: Verifica
        env:
          RAMO: ${{ inputs.ramo }}
          # Servono per chiedere l'approvazione con i numeri gia' in mano:
          # rileggerli dai log dopo non funziona, e Vlad si ritrovava a dover
          # approvare senza sapere cosa.
          HUB_URL: ${{ secrets.HUB_URL }}
          GIGI_API_TOKEN: ${{ secrets.GIGI_API_TOKEN }}
        run: node .github/agent/verifica-ramo.mjs
